name: Package Foundry module release

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          version="$(jq -r '.version // empty' module.json)"
          tag_version="${RELEASE_TAG#v}"
          if [ -z "$version" ] || [ "$tag_version" != "$version" ]; then
            echo "::error::Release tag $RELEASE_TAG must match module.json version $version (optionally prefixed with v)."
            exit 1
          fi

      - name: Build module archive
        run: |
          package_dir="$RUNNER_TEMP/dragonmyth-sync"
          mkdir -p "$package_dir"
          cp module.json README.md "$package_dir/"
          cp -R scripts "$package_dir/"
          (
            cd "$package_dir"
            zip -r "$RUNNER_TEMP/dragonmyth-sync.zip" module.json README.md scripts
          )

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dragonmyth-sync.zip" --repo "$GITHUB_REPOSITORY" --clobber
